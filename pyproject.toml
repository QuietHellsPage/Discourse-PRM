[project]
name = "discourse-prm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QuietHellsPage", email = "baazhinga@yandex.ru" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate",
    "datasets>=5.1.0",
    "peft",
    "scikit-learn",
    "tensorboard",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = ["datasets.*", "config.constants", "sklearn.*"]
ignore_missing_imports = true
